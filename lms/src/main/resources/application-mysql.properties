# Built from individual host/port/db-name variables so it works both locally
# (defaults below) and on Railway, which injects MYSQLHOST/MYSQLPORT/MYSQLDATABASE
# automatically once you attach its MySQL plugin.
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:librarydb}?createDatabaseIfNotExist=true
spring.datasource.username=${MYSQLUSER:${DB_USERNAME:root}}
spring.datasource.password=${MYSQLPASSWORD:${DB_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=update
