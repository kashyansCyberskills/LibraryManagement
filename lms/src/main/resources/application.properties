spring.application.name=lms
# Railway/Render inject PORT at runtime; 8080 is only the local default.
server.port=${PORT:8080}

# Default database: file-based H2 (runs with zero setup).
# For MySQL start with:  --spring.profiles.active=mysql   (see application-mysql.properties)
spring.datasource.url=jdbc:h2:file:./data/librarydb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# JWT secret is required (at least 32 characters); provide it via the environment.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000

# CORS - comma-separated list of origins allowed to call the API.
# Locally this is the Vite dev server; in production set it to your deployed frontend's URL.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Library rules
library.loan-days=14
library.fine-per-day=2.00
library.max-active-loans=5

# First-run seed data (an admin is created only if no admin exists)
app.admin.name=Library Admin
app.admin.email=admin@library.com
app.admin.password=${ADMIN_PASSWORD}
app.seed-sample-data=true
